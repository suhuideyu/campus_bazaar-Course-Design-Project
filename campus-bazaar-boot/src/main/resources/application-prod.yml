# 生产环境配置（部署时修改为真实服务器地址）
spring:
  datasource:
    # 生产环境通常使用独立数据库服务器，账号密码不要提交真实值到公开仓库
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-server-ip:3306/campus_bazaar?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: your_db_user
    password: your_db_password
    druid:
      initial-size: 10
      max-active: 50
      min-idle: 10

logging:
  level:
    # 生产环境日志级别更高，减少 SQL 和调试日志输出
    com.bazaar: warn
