# 开发环境配置
spring:
  datasource:
    # 技术点：Druid 是数据库连接池，负责复用连接，提高访问数据库的效率
    type: com.alibaba.druid.pool.DruidDataSource
    # MySQL 8.x 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发数据库地址；serverTimezone 避免 JDBC 时间时区警告
    url: jdbc:mysql://localhost:3306/campus_bazaar?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    druid:
      # 初始化连接数：应用启动时先创建 5 个数据库连接
      initial-size: 5
      # 最大活跃连接数：同时最多借出 20 个连接
      max-active: 20
      # 最小空闲连接数：空闲时至少保留 5 个连接
      min-idle: 5
      # 空闲连接借出前先检测是否可用
      test-while-idle: true
      # Druid 用这条 SQL 检测连接是否有效
      validation-query: SELECT 1
